<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试登录</title>
</head>
<body>
    <h1>测试管理员登录</h1>
    
    <h2>1. 访问管理页面（应该自动跳转到登录页面）</h2>
    <p><a href="http://localhost:3000/admin" target="_blank">点击访问管理页面</a></p>
    
    <h2>2. 直接访问登录页面</h2>
    <p><a href="http://localhost:3000/admin/login" target="_blank">点击访问登录页面</a></p>
    
    <h2>3. 测试登录API</h2>
    <div>
        <label>密码: <input type="password" id="password" placeholder="输入管理员密码"></label>
        <button onclick="testLogin()">测试登录</button>
    </div>
    <div id="result"></div>
    
    <h2>4. 测试管理API（需要先登录）</h2>
    <button onclick="testAdminAPI()">测试获取统计数据</button>
    <div id="apiResult"></div>

    <script>
        async function testLogin() {
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password: password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 保存token
                    localStorage.setItem('admin_token', result.token);
                    localStorage.setItem('admin_expires', result.expires_at);
                    resultDiv.innerHTML = `<p style="color: green;">✅ 登录成功！Token已保存</p>`;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">❌ 登录失败: ${result.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">❌ 网络错误: ${error.message}</p>`;
            }
        }
        
        async function testAdminAPI() {
            const apiResultDiv = document.getElementById('apiResult');
            const token = localStorage.getItem('admin_token');
            
            if (!token) {
                apiResultDiv.innerHTML = '<p style="color: red;">❌ 请先登录</p>';
                return;
            }
            
            try {
                const response = await fetch('/api/admin/stats', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const stats = await response.json();
                    apiResultDiv.innerHTML = `<p style="color: green;">✅ API调用成功: ${JSON.stringify(stats)}</p>`;
                } else {
                    apiResultDiv.innerHTML = `<p style="color: red;">❌ API调用失败: ${response.status}</p>`;
                }
            } catch (error) {
                apiResultDiv.innerHTML = `<p style="color: red;">❌ 网络错误: ${error.message}</p>`;
            }
        }
        
        // 页面加载时检查token状态
        window.addEventListener('load', function() {
            const token = localStorage.getItem('admin_token');
            const expires = localStorage.getItem('admin_expires');
            
            if (token && expires) {
                const expiresDate = new Date(expires);
                const now = new Date();
                
                if (expiresDate > now) {
                    document.getElementById('result').innerHTML = '<p style="color: blue;">ℹ️ 已有有效登录token</p>';
                } else {
                    document.getElementById('result').innerHTML = '<p style="color: orange;">⚠️ Token已过期</p>';
                    localStorage.removeItem('admin_token');
                    localStorage.removeItem('admin_expires');
                }
            }
        });
    </script>
</body>
</html>
