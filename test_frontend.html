<!DOCTYPE html>
<html>
<head>
    <title>测试前端功能</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { margin: 10px; padding: 10px 20px; }
        .result { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>测试前端功能</h1>
    
    <button onclick="testLogin()">测试登录</button>
    <button onclick="testSummary()">测试获取总览</button>
    <button onclick="testBalance()">测试获取余额</button>
    
    <div id="result" class="result"></div>

    <script>
        let token = '';
        
        async function testLogin() {
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'admin', password: '123456' })
                });
                
                const data = await response.json();
                if (data.success) {
                    token = data.token;
                    localStorage.setItem('adminToken', token);
                    document.getElementById('result').innerHTML = `<h3>登录成功</h3><p>Token: ${token}</p>`;
                } else {
                    document.getElementById('result').innerHTML = `<h3>登录失败</h3><p>${data.message}</p>`;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `<h3>登录错误</h3><p>${error.message}</p>`;
            }
        }
        
        async function testSummary() {
            const token = localStorage.getItem('adminToken');
            if (!token) {
                alert('请先登录');
                return;
            }
            
            try {
                const response = await fetch('/api/admin/registrations/08e6603a-f811-4edb-b93a-d0422d4733c4/summary', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                document.getElementById('result').innerHTML = `
                    <h3>获取总览结果</h3>
                    <p><strong>成功:</strong> ${data.success}</p>
                    <p><strong>消息:</strong> ${data.message}</p>
                    <p><strong>总USDT估值:</strong> ${data.total_usdt_value} USDT</p>
                    <p><strong>币种数量:</strong> ${data.balances ? data.balances.length : 0}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `<h3>获取总览错误</h3><p>${error.message}</p>`;
            }
        }
        
        async function testBalance() {
            const token = localStorage.getItem('adminToken');
            if (!token) {
                alert('请先登录');
                return;
            }
            
            try {
                const response = await fetch('/api/admin/registrations/08e6603a-f811-4edb-b93a-d0422d4733c4/balance', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                document.getElementById('result').innerHTML = `
                    <h3>获取余额结果</h3>
                    <p><strong>成功:</strong> ${data.success}</p>
                    <p><strong>消息:</strong> ${data.message}</p>
                    <p><strong>币种数量:</strong> ${data.balances ? data.balances.length : 0}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `<h3>获取余额错误</h3><p>${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
