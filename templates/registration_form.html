<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNHBot 用户报名</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
            font-size: 1.1em;
        }
        .form-container {
            padding: 40px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .exchange-info {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .exchange-info h3 {
            margin-top: 0;
            color: #495057;
        }
        .exchange-info ul {
            margin: 10px 0;
            padding-left: 20px;
        }
        .exchange-info li {
            margin-bottom: 5px;
            color: #6c757d;
        }
        .required {
            color: #dc3545;
        }
        .api-fields {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .api-fields h4 {
            margin-top: 0;
            color: #856404;
        }
        .api-fields p {
            margin: 5px 0;
            color: #856404;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 BNHBot</h1>
            <p>加入交易大赛，记录成长点滴</p>
        </div>
        
        <div class="form-container">
            <div class="exchange-info">
                <h3>📊 支持的交易所</h3>
                <ul>
                    <li><strong>币安 (Binance)</strong> - 全球最大的加密货币交易所</li>
                    <li><strong>欧易 (OKX)</strong> - 专业的数字资产交易平台</li>
                    <li><strong>WEEX</strong> - 新兴的加密货币交易所</li>
                </ul>
            </div>

            <div class="api-fields">
                <h4>🔑 API信息说明</h4>
                <p><strong>币安 & WEEX:</strong> 需要 API Key 和 Secret Key</p>
                <p><strong>欧易 (OKX):</strong> 需要 API Key、Secret Key 和 Passphrase</p>
                <p><em>请确保您的API具有读取权限，我们不会进行任何交易操作</em></p>
            </div>

            <form id="registrationForm">
                <div class="form-group">
                    <label for="exchange">选择交易所 <span class="required">*</span></label>
                    <select id="exchange" name="exchange" required>
                        <option value="">请选择交易所</option>
                        <option value="binance">币安 (Binance)</option>
                        <option value="okx">欧易 (OKX)</option>
                        <option value="weex">WEEX</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="apiKey">API Key <span class="required">*</span></label>
                    <input type="text" id="apiKey" name="apiKey" required placeholder="请输入您的API Key">
                </div>

                <div class="form-group">
                    <label for="secretKey">Secret Key <span class="required">*</span></label>
                    <input type="password" id="secretKey" name="secretKey" required placeholder="请输入您的Secret Key">
                </div>

                <div class="form-group" id="passphraseGroup" style="display: none;">
                    <label for="passphrase">Passphrase <span class="required">*</span></label>
                    <input type="password" id="passphrase" name="passphrase" placeholder="请输入您的Passphrase">
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="submitText">提交报名</span>
                    <span id="loadingText" style="display: none;">提交中...</span>
                </button>
            </form>

            <div class="success-message" id="successMessage">
                <h3>✅ 报名成功！</h3>
                <p>您的报名信息已提交，管理员会尽快审核。请保持关注！</p>
            </div>

            <div class="error-message" id="errorMessage">
                <h3>❌ 报名失败</h3>
                <p id="errorText">提交过程中出现错误，请重试。</p>
            </div>
        </div>
    </div>

    <script>
        // 交易所选择变化时显示/隐藏Passphrase字段
        document.getElementById('exchange').addEventListener('change', function() {
            const passphraseGroup = document.getElementById('passphraseGroup');
            const passphraseInput = document.getElementById('passphrase');
            
            if (this.value === 'okx') {
                passphraseGroup.style.display = 'block';
                passphraseInput.required = true;
            } else {
                passphraseGroup.style.display = 'none';
                passphraseInput.required = false;
                passphraseInput.value = '';
            }
        });

        // 表单提交处理
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const loadingText = document.getElementById('loadingText');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            
            // 显示加载状态
            submitBtn.disabled = true;
            submitText.style.display = 'none';
            loadingText.style.display = 'inline';
            
            // 隐藏之前的消息
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            
            // 收集表单数据
            const formData = {
                exchange: document.getElementById('exchange').value,
                api_key: document.getElementById('apiKey').value,
                secret_key: document.getElementById('secretKey').value,
                passphrase: document.getElementById('passphrase').value
            };
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    // 成功
                    successMessage.style.display = 'block';
                    document.getElementById('registrationForm').reset();
                    document.getElementById('passphraseGroup').style.display = 'none';
                } else {
                    // 失败
                    errorMessage.style.display = 'block';
                    document.getElementById('errorText').textContent = result.message || '提交失败，请重试';
                }
            } catch (error) {
                // 网络错误
                errorMessage.style.display = 'block';
                document.getElementById('errorText').textContent = '网络错误，请检查网络连接后重试';
            } finally {
                // 恢复按钮状态
                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                loadingText.style.display = 'none';
            }
        });
    </script>
</body>
</html>
