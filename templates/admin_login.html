<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BNHBot 管理员登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .login-header h1 {
            font-size: 2.2em;
            font-weight: 300;
            margin-bottom: 10px;
        }
        
        .login-header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .login-form {
            padding: 40px 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .login-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .login-btn .loading {
            display: none;
        }
        
        .login-btn.loading .btn-text {
            display: none;
        }
        
        .login-btn.loading .loading {
            display: inline;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            border: 1px solid #f5c6cb;
        }
        
        .security-info {
            background: #d1ecf1;
            color: #0c5460;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9em;
            border: 1px solid #bee5eb;
        }
        
        .security-info h4 {
            margin-bottom: 8px;
            color: #0c5460;
        }
        
        .security-info ul {
            margin: 8px 0;
            padding-left: 20px;
        }
        
        .security-info li {
            margin-bottom: 4px;
        }
        
        .password-strength {
            margin-top: 8px;
            font-size: 0.9em;
        }
        
        .strength-bar {
            height: 4px;
            background: #e1e5e9;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .strength-fill {
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .strength-weak { background: #dc3545; width: 25%; }
        .strength-fair { background: #ffc107; width: 50%; }
        .strength-good { background: #28a745; width: 75%; }
        .strength-strong { background: #007bff; width: 100%; }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .login-container {
                max-width: 100%;
                border-radius: 15px;
            }

            .login-header {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 2em;
            }

            .login-header p {
                font-size: 1em;
            }

            .login-form {
                padding: 30px 20px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .form-group label {
                font-size: 1em;
            }

            .form-group input {
                padding: 12px;
                font-size: 16px; /* 防止iOS缩放 */
            }

            .login-btn {
                padding: 15px 30px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .login-header h1 {
                font-size: 1.8em;
            }

            .login-form {
                padding: 25px 15px;
            }

            .form-group input {
                padding: 10px;
            }

            .login-btn {
                padding: 12px 25px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 管理员登录</h1>
            <p>BNHBot 后台管理系统</p>
        </div>
        
        <div class="login-form">
            <div class="error-message" id="errorMessage">
                <strong>登录失败！</strong>
                <span id="errorText">用户名或密码错误</span>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="password">管理员密码</label>
                    <input type="password" id="password" name="password" required 
                           placeholder="请输入管理员密码" autocomplete="current-password">
                    <div class="password-strength" id="passwordStrength" style="display: none;">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span id="strengthText"></span>
                    </div>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">🚀 登录管理后台</span>
                    <span class="loading">🔄 验证中...</span>
                </button>
            </form>
            
            <div class="security-info">
                <h4>🛡️ 安全提示</h4>
                <ul>
                    <li>请使用强密码保护管理员账户</li>
                    <li>登录会话将在24小时后自动过期</li>
                    <li>请勿在公共设备上保存登录状态</li>
                    <li>发现异常活动请立即更改密码</li>
                </ul>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2025 BNHBot | <a href="/">返回首页</a></p>
        </div>
    </div>

    <script>
        // 表单提交处理
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            const password = document.getElementById('password').value;
            
            // 显示加载状态
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            errorMessage.style.display = 'none';
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password: password })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    // 登录成功，保存token并跳转
                    localStorage.setItem('admin_token', result.token);
                    localStorage.setItem('admin_expires', result.expires_at);
                    
                    // 添加成功动画
                    loginBtn.innerHTML = '✅ 登录成功！正在跳转...';
                    loginBtn.style.background = '#28a745';
                    
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 1000);
                } else {
                    // 登录失败
                    document.getElementById('errorText').textContent = result.message || '登录失败，请检查密码';
                    errorMessage.style.display = 'block';
                    
                    // 密码框抖动效果
                    const passwordInput = document.getElementById('password');
                    passwordInput.style.animation = 'shake 0.5s ease-in-out';
                    setTimeout(() => {
                        passwordInput.style.animation = '';
                    }, 500);
                }
            } catch (error) {
                document.getElementById('errorText').textContent = '网络错误，请重试';
                errorMessage.style.display = 'block';
            } finally {
                // 恢复按钮状态
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
                if (!loginBtn.innerHTML.includes('✅')) {
                    loginBtn.innerHTML = '<span class="btn-text">🚀 登录管理后台</span><span class="loading">🔄 验证中...</span>';
                }
            }
        });
        
        // 密码强度检测（可选功能）
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthContainer = document.getElementById('passwordStrength');
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            
            if (password.length === 0) {
                strengthContainer.style.display = 'none';
                return;
            }
            
            strengthContainer.style.display = 'block';
            
            let strength = 0;
            let strengthLabel = '';
            
            // 检查密码强度
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            // 设置强度显示
            strengthFill.className = 'strength-fill';
            switch (strength) {
                case 0:
                case 1:
                    strengthFill.classList.add('strength-weak');
                    strengthLabel = '弱';
                    break;
                case 2:
                    strengthFill.classList.add('strength-fair');
                    strengthLabel = '一般';
                    break;
                case 3:
                case 4:
                    strengthFill.classList.add('strength-good');
                    strengthLabel = '良好';
                    break;
                case 5:
                    strengthFill.classList.add('strength-strong');
                    strengthLabel = '强';
                    break;
            }
            
            strengthText.textContent = `密码强度: ${strengthLabel}`;
        });
        
        // 添加抖动动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);
        
        // 检查是否已经登录
        window.addEventListener('load', function() {
            const token = localStorage.getItem('admin_token');
            const expires = localStorage.getItem('admin_expires');
            
            if (token && expires) {
                const expiresDate = new Date(expires);
                if (expiresDate > new Date()) {
                    // Token还有效，直接跳转到管理页面
                    window.location.href = '/admin';
                } else {
                    // Token已过期，清除
                    localStorage.removeItem('admin_token');
                    localStorage.removeItem('admin_expires');
                }
            }
        });
    </script>
</body>
</html>
